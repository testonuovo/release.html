<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oreste AI - Release v1.0.0</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0b0f1a;
color:white;
text-align:center;
}

.container{
padding:80px 20px;
}

h1{
font-size:50px;
margin-bottom:10px;
}

.badge{
display:inline-block;
padding:6px 14px;
border-radius:20px;
background:#1f2a44;
opacity:0.9;
font-size:14px;
margin-bottom:20px;
}

.card{
background:#111827;
padding:20px;
border-radius:16px;
margin:20px auto;
max-width:500px;
}

button{
padding:18px 35px;
font-size:18px;
border:none;
border-radius:12px;
background:#0071e3;
color:white;
cursor:pointer;
margin:10px;
transition:0.2s;
}

button:hover{
background:#2997ff;
transform:scale(1.05);
}

.secondary{
background:#333 !important;
}

footer{
opacity:0.5;
padding:40px;
font-size:13px;
}

</style>
</head>

<body>

<div class="container">

<h1>Oreste AI</h1>

<div class="badge">Release v1.0.0</div>

<p>Assistente vocale intelligente per Windows</p>

<div class="card">
✔ AI vocale avanzata<br>
✔ Comandi PC<br>
✔ Apertura siti web<br>
✔ Ricerca intelligente<br>
✔ Modalità offline
</div>

<button onclick="download()">⬇ Scarica Oreste AI</button>

<br>

<button class="secondary" onclick="openGitHub()">
🌐 Vedi su GitHub
</button>

</div>

<footer>
Oreste AI Official Release Page © 2026
</footer>

<script>

/* 🎤 VOCE */
function speak(text){
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "it-IT";
  speechSynthesis.cancel();
  speechSynthesis.speak(msg);
}

/* 📥 DOWNLOAD */
function download(){

  speak("Avvio download di Oreste AI");

  const url = "https://github.com/testonuovo/testonuovo.github.io/releases/download/v1.0.0/OresteAI.zip";

  setTimeout(()=>{

    window.open(url, "_blank");

    speak("Download avviato");

  },1000);

}

/* 🌐 GITHUB */
function openGitHub(){
  window.open("https://github.com/testonuovo/testonuovo.github.io/releases/tag/v1.0.0","_blank");
}

</script>

</body>
</html>
